<svg xmlns="http://www.w3.org/2000/svg" width="200mm" height="212.5mm" viewBox="0 0 800 850" role="img" aria-labelledby="title-0bd79626a7 desc-0bd79626a7"><title id="title-0bd79626a7">Look what is missing. Overlay only</title><desc id="desc-0bd79626a7">An opaque illustrated paper overlay with 4 transparent cutout openings. It reveals pot IDs [4, 5, 9, 10]. All other garden content is hidden until the page is lifted. Decorative frames belong to the paper, not the physical garden.</desc><g id="overlay-pessimism"><path d="M 0 0 H 800 V 850 H 0 Z M 227 398 h 36 v 54 h -36 Z M 272 398 h 36 v 54 h -36 Z M 627 398 h 36 v 54 h -36 Z M 672 398 h 36 v 54 h -36 Z" fill="#eee1cf" fill-rule="evenodd"/><rect x="17" y="17" width="766" height="816" fill="none" stroke="#8d5947" stroke-width="2"/><path d="M 40 26 V 824" fill="none" stroke="#8d5947" stroke-width="1"/><text x="61" y="57" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#8d5947">MANY MAYBES / CUTOUT PAGE</text><text x="61" y="103" font-family="DejaVu Sans,sans-serif" font-size="34" fill="#8d5947">Look what is missing.</text><text x="61" y="137" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#8d5947">A page of absences</text><path d="M 22 180 h 9" fill="none" stroke="#8d5947" stroke-width="2"/><path d="M 22 230 h 9" fill="none" stroke="#8d5947" stroke-width="2"/><path d="M 22 280 h 9" fill="none" stroke="#8d5947" stroke-width="2"/><path d="M 22 330 h 9" fill="none" stroke="#8d5947" stroke-width="2"/><path d="M 22 380 h 9" fill="none" stroke="#8d5947" stroke-width="2"/><path d="M 22 430 h 9" fill="none" stroke="#8d5947" stroke-width="2"/><path d="M 22 480 h 9" fill="none" stroke="#8d5947" stroke-width="2"/><path d="M 22 530 h 9" fill="none" stroke="#8d5947" stroke-width="2"/><path d="M 22 580 h 9" fill="none" stroke="#8d5947" stroke-width="2"/><path d="M 22 630 h 9" fill="none" stroke="#8d5947" stroke-width="2"/><path d="M 22 680 h 9" fill="none" stroke="#8d5947" stroke-width="2"/><path d="M 22 730 h 9" fill="none" stroke="#8d5947" stroke-width="2"/><path d="M 66 166 l 8 8 l -8 8 l -8 -8 Z" fill="none" stroke="#8d5947" stroke-width="1"/><path d="M 734 166 l 8 8 l -8 8 l -8 -8 Z" fill="none" stroke="#8d5947" stroke-width="1"/><rect x="221" y="389" width="48" height="72" fill="none" stroke="#8d5947" stroke-width="2"/><path d="M 218 379 h 12 M 260 379 h 12 M 218 471 h 12 M 260 471 h 12" fill="none" stroke="#8d5947" stroke-width="1"/><rect x="266" y="389" width="48" height="72" fill="none" stroke="#8d5947" stroke-width="2"/><path d="M 263 379 h 12 M 305 379 h 12 M 263 471 h 12 M 305 471 h 12" fill="none" stroke="#8d5947" stroke-width="1"/><rect x="621" y="389" width="48" height="72" fill="none" stroke="#8d5947" stroke-width="2"/><path d="M 618 379 h 12 M 660 379 h 12 M 618 471 h 12 M 660 471 h 12" fill="none" stroke="#8d5947" stroke-width="1"/><rect x="666" y="389" width="48" height="72" fill="none" stroke="#8d5947" stroke-width="2"/><path d="M 663 379 h 12 M 705 379 h 12 M 663 471 h 12 M 705 471 h 12" fill="none" stroke="#8d5947" stroke-width="1"/><text x="82" y="550" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#8d5947">You are seeing selected pots without shoots.</text><text x="82" y="586" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#8d5947">An absence can fill your whole field of view.</text><rect x="227" y="398" width="36" height="54" fill="none" stroke="#8d5947" stroke-width="1.2"/><rect x="272" y="398" width="36" height="54" fill="none" stroke="#8d5947" stroke-width="1.2"/><rect x="627" y="398" width="36" height="54" fill="none" stroke="#8d5947" stroke-width="1.2"/><rect x="672" y="398" width="36" height="54" fill="none" stroke="#8d5947" stroke-width="1.2"/><text x="82" y="650" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#8d5947">These are paper windows, not new garden structures.</text><text x="61" y="790" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#8d5947">What might exist outside these openings?</text><text x="61" y="819" font-family="DejaVu Sans,sans-serif" font-size="12" fill="#8d5947">LIFT THIS PAGE TO REVEAL THE WHOLE GARDEN</text><path d="M 25 120 h 10 M 30 115 v 10" fill="none" stroke="#9b9c91" stroke-width="1"/><path d="M 765 120 h 10 M 770 115 v 10" fill="none" stroke="#9b9c91" stroke-width="1"/><path d="M 25 800 h 10 M 30 795 v 10" fill="none" stroke="#9b9c91" stroke-width="1"/><path d="M 765 800 h 10 M 770 795 v 10" fill="none" stroke="#9b9c91" stroke-width="1"/></g></svg>