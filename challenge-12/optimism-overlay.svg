<svg xmlns="http://www.w3.org/2000/svg" width="200mm" height="212.5mm" viewBox="0 0 800 850" role="img" aria-labelledby="title-2d4d66ccab desc-2d4d66ccab"><title id="title-2d4d66ccab">Look what grew. Overlay only</title><desc id="desc-2d4d66ccab">An opaque illustrated paper overlay with 6 transparent cutout openings. It reveals pot IDs [1, 2, 3, 6, 7, 8]. All other garden content is hidden until the page is lifted. Decorative frames belong to the paper, not the physical garden.</desc><g id="overlay-optimism"><path d="M 0 0 H 800 V 850 H 0 Z M 92 358 h 36 v 94 h -36 Z M 137 358 h 36 v 94 h -36 Z M 182 358 h 36 v 94 h -36 Z M 492 358 h 36 v 94 h -36 Z M 537 358 h 36 v 94 h -36 Z M 582 358 h 36 v 94 h -36 Z" fill="#edf0d9" fill-rule="evenodd"/><rect x="17" y="17" width="766" height="816" fill="none" stroke="#456c48" stroke-width="2"/><path d="M 40 26 V 824" fill="none" stroke="#456c48" stroke-width="1"/><text x="61" y="57" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#456c48">MANY MAYBES / CUTOUT PAGE</text><text x="61" y="103" font-family="DejaVu Sans,sans-serif" font-size="34" fill="#456c48">Look what grew.</text><text x="61" y="137" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#456c48">A page of growth</text><path d="M 22 180 h 9" fill="none" stroke="#456c48" stroke-width="2"/><path d="M 22 230 h 9" fill="none" stroke="#456c48" stroke-width="2"/><path d="M 22 280 h 9" fill="none" stroke="#456c48" stroke-width="2"/><path d="M 22 330 h 9" fill="none" stroke="#456c48" stroke-width="2"/><path d="M 22 380 h 9" fill="none" stroke="#456c48" stroke-width="2"/><path d="M 22 430 h 9" fill="none" stroke="#456c48" stroke-width="2"/><path d="M 22 480 h 9" fill="none" stroke="#456c48" stroke-width="2"/><path d="M 22 530 h 9" fill="none" stroke="#456c48" stroke-width="2"/><path d="M 22 580 h 9" fill="none" stroke="#456c48" stroke-width="2"/><path d="M 22 630 h 9" fill="none" stroke="#456c48" stroke-width="2"/><path d="M 22 680 h 9" fill="none" stroke="#456c48" stroke-width="2"/><path d="M 22 730 h 9" fill="none" stroke="#456c48" stroke-width="2"/><path d="M 66 166 l 8 8 l -8 8 l -8 -8 Z" fill="none" stroke="#456c48" stroke-width="1"/><path d="M 734 166 l 8 8 l -8 8 l -8 -8 Z" fill="none" stroke="#456c48" stroke-width="1"/><path d="M 78 460 V 333 L 155.0 281 L 232 333 V 460 Z" fill="none" stroke="#456c48" stroke-width="3"/><path d="M 78 333 H 232 M 155.0 281 V 343" fill="none" stroke="#456c48" stroke-width="1"/><path d="M 72 469 H 238" fill="none" stroke="#456c48" stroke-width="2"/><path d="M 72 477 H 238" fill="none" stroke="#456c48" stroke-width="2"/><path d="M 478 460 V 333 L 555.0 281 L 632 333 V 460 Z" fill="none" stroke="#456c48" stroke-width="3"/><path d="M 478 333 H 632 M 555.0 281 V 343" fill="none" stroke="#456c48" stroke-width="1"/><path d="M 472 469 H 638" fill="none" stroke="#456c48" stroke-width="2"/><path d="M 472 477 H 638" fill="none" stroke="#456c48" stroke-width="2"/><text x="82" y="550" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#456c48">You are seeing selected growing plants.</text><text x="82" y="586" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#456c48">The openings decide where your eyes go.</text><rect x="92" y="358" width="36" height="94" fill="none" stroke="#456c48" stroke-width="1.2"/><rect x="137" y="358" width="36" height="94" fill="none" stroke="#456c48" stroke-width="1.2"/><rect x="182" y="358" width="36" height="94" fill="none" stroke="#456c48" stroke-width="1.2"/><rect x="492" y="358" width="36" height="94" fill="none" stroke="#456c48" stroke-width="1.2"/><rect x="537" y="358" width="36" height="94" fill="none" stroke="#456c48" stroke-width="1.2"/><rect x="582" y="358" width="36" height="94" fill="none" stroke="#456c48" stroke-width="1.2"/><text x="82" y="650" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#456c48">These are paper windows, not new garden structures.</text><text x="61" y="790" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#456c48">Does this glimpse tell the whole story?</text><text x="61" y="819" font-family="DejaVu Sans,sans-serif" font-size="12" fill="#456c48">LIFT THIS PAGE TO REVEAL THE WHOLE GARDEN</text><path d="M 25 120 h 10 M 30 115 v 10" fill="none" stroke="#9b9c91" stroke-width="1"/><path d="M 765 120 h 10 M 770 115 v 10" fill="none" stroke="#9b9c91" stroke-width="1"/><path d="M 25 800 h 10 M 30 795 v 10" fill="none" stroke="#9b9c91" stroke-width="1"/><path d="M 765 800 h 10 M 770 795 v 10" fill="none" stroke="#9b9c91" stroke-width="1"/></g></svg>