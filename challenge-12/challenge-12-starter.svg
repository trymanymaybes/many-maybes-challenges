<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" role="img" aria-label="A neutral person holds a wavy line that rises to an unfinished endpoint. Most of the page is blank."><title>One windy moment</title><rect width="1200" height="1000" fill="#fffdf6"/><g id="fixed-starter"><polyline points="372.0,540.0 371.81,543.13 371.25,546.21 370.33,549.18 369.05,552.0 367.45,554.61 365.56,556.97 363.39,559.04 361.0,560.78 358.42,562.17 355.69,563.18 352.87,563.79 350.0,564.0 347.13,563.79 344.31,563.18 341.58,562.17 339.0,560.78 336.61,559.04 334.44,556.97 332.55,554.61 330.95,552.0 329.67,549.18 328.75,546.21 328.19,543.13 328.0,540.0 328.19,536.87 328.75,533.79 329.67,530.82 330.95,528.0 332.55,525.39 334.44,523.03 336.61,520.96 339.0,519.22 341.58,517.83 344.31,516.82 347.13,516.21 350.0,516.0 352.87,516.21 355.69,516.82 358.42,517.83 361.0,519.22 363.39,520.96 365.56,523.03 367.45,525.39 369.05,528.0 370.33,530.82 371.25,533.79 371.81,536.87 372.0,540.0" stroke="#244d45" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="350,564 350,650 318,710" stroke="#244d45" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="350,650 385,710" stroke="#244d45" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="350,590 392,605 420,575" stroke="#244d45" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="350,590 320,620" stroke="#244d45" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="420,575 475,555 510,515 558,500 605,462 650,450 700,410" stroke="#244d45" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g id="additions"></g><text x="80" y="70" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#244d45" font-weight="700">MANY MAYBES  /  CHALLENGE 12</text><text x="80" y="126" font-family="DejaVu Sans,sans-serif" font-size="38" fill="#244d45" font-weight="700">The wind has picked up.</text><text x="80" y="165" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#244d45" font-weight="400">What does your thinking make you draw next?</text><text x="80" y="870" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#244d45" font-weight="400">Keep the person and wavy line. Add a scene around them.</text><text x="80" y="910" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#244d45" font-weight="400">Imagine an opportunity, a worry, or a question.</text></svg>