<svg xmlns="http://www.w3.org/2000/svg" width="200mm" height="212.5mm" viewBox="0 0 800 850" role="img" aria-labelledby="title-c3f70e523a desc-c3f70e523a"><title id="title-c3f70e523a">curiosity cutting template</title><desc id="desc-c3f70e523a">Solid rectangular inner outlines mark the cutouts; the page boundary and registration marks are retained.</desc><rect x="0" y="0" width="800" height="850" fill="white" stroke="none" stroke-width="2"/><rect x="17" y="17" width="766" height="816" fill="none" stroke="#294d44" stroke-width="2"/><text x="60" y="60" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#294d44">CURIOSITY / CUTOUT TEMPLATE</text><text x="60" y="95" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#294d44">Cut solid inner rectangles. Keep page edge and registration marks.</text><path d="M 25 120 h 10 M 30 115 v 10" fill="none" stroke="#9b9c91" stroke-width="1"/><path d="M 765 120 h 10 M 770 115 v 10" fill="none" stroke="#9b9c91" stroke-width="1"/><path d="M 25 800 h 10 M 30 795 v 10" fill="none" stroke="#9b9c91" stroke-width="1"/><path d="M 765 800 h 10 M 770 795 v 10" fill="none" stroke="#9b9c91" stroke-width="1"/><rect x="55" y="235" width="705" height="500" fill="none" stroke="#294d44" stroke-width="2"/><text x="58" y="485.0" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#294d44">CUT</text><path d="M 40 150 V 775" fill="none" stroke="#777" stroke-width="1"/><text x="61" y="820" font-family="DejaVu Sans,sans-serif" font-size="12" fill="#294d44">Hinge at left. Print all layers at the same scale; do not fit separately.</text></svg>